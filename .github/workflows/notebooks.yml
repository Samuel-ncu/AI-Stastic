name: Validate teaching notebooks
on:
  push:
    paths:
      - 'notebooks/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/notebooks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install CPU PyTorch for the financial time-series lab
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.5,<3'
      - run: python scripts/validate_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed_notebooks/
