<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 325" width="720" height="325" role="img" aria-labelledby="title desc">
<title id="title">用每個種子的差值檢查改善是否一致</title><desc id="desc">依種子零到四，B 減 A 的差是加二、加二、減一、加二、加二個百分點。平均加一點四個百分點。</desc>
<rect width="720" height="325" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">用每個種子的差值檢查改善是否一致</text><text x="27" y="62" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">自編驗證 Accuracy。向下的點表示該次 B 比 A 低。</text><line x1="77" y1="240.5" x2="681" y2="240.5" stroke="#d9e3ef" stroke-width="1"/><text x="68" y="245.5" text-anchor="end" fill="#50647b" font-size="14" font-weight="500">-1</text><line x1="77" y1="197.5" x2="681" y2="197.5" stroke="#d9e3ef" stroke-width="1"/><text x="68" y="202.5" text-anchor="end" fill="#50647b" font-size="14" font-weight="500">0</text><line x1="77" y1="154.5" x2="681" y2="154.5" stroke="#d9e3ef" stroke-width="1"/><text x="68" y="159.5" text-anchor="end" fill="#50647b" font-size="14" font-weight="500">1</text><line x1="77" y1="111.5" x2="681" y2="111.5" stroke="#d9e3ef" stroke-width="1"/><text x="68" y="116.5" text-anchor="end" fill="#50647b" font-size="14" font-weight="500">2</text><line x1="77" y1="262" x2="77" y2="268" stroke="#50647b" stroke-width="1"/><text x="77" y="284" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">0</text><line x1="228" y1="262" x2="228" y2="268" stroke="#50647b" stroke-width="1"/><text x="228" y="284" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">1</text><line x1="379" y1="262" x2="379" y2="268" stroke="#50647b" stroke-width="1"/><text x="379" y="284" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">2</text><line x1="530" y1="262" x2="530" y2="268" stroke="#50647b" stroke-width="1"/><text x="530" y="284" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">3</text><line x1="681" y1="262" x2="681" y2="268" stroke="#50647b" stroke-width="1"/><text x="681" y="284" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">4</text><line x1="77" y1="90" x2="77" y2="262" stroke="#50647b" stroke-width="1"/><line x1="77" y1="262" x2="681" y2="262" stroke="#50647b" stroke-width="1"/><text x="379" y="306" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">訓練種子</text><text x="77" y="82" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">B − A（百分點）</text><line x1="77" y1="197.5" x2="681" y2="197.5" stroke="#50647b" stroke-width="1"/><line x1="77" y1="137.3" x2="681" y2="137.3" stroke="#126c56" stroke-width="2" stroke-dasharray="5 4"/><line x1="77" y1="197.5" x2="77" y2="111.5" stroke="#155eaa" stroke-width="3"/><circle cx="77" cy="111.5" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><line x1="228" y1="197.5" x2="228" y2="111.5" stroke="#155eaa" stroke-width="3"/><circle cx="228" cy="111.5" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><line x1="379" y1="197.5" x2="379" y2="240.5" stroke="#a64614" stroke-width="3"/><circle cx="379" cy="240.5" r="6" fill="#a64614" stroke="#ffffff" stroke-width="1.5"/><line x1="530" y1="197.5" x2="530" y2="111.5" stroke="#155eaa" stroke-width="3"/><circle cx="530" cy="111.5" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><line x1="681" y1="197.5" x2="681" y2="111.5" stroke="#155eaa" stroke-width="3"/><circle cx="681" cy="111.5" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><text x="409" y="155.3" text-anchor="start" fill="#126c56" font-size="14" font-weight="500">平均 +1.4 個百分點</text></g>
</svg>
