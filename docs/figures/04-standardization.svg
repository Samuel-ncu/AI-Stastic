<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 307" width="720" height="307" role="img" aria-labelledby="title desc">
<title id="title">標準化把中心移到 0，再換掉刻度</title><desc id="desc">原始訓練值十、二十、三十轉為負一點二二五、零、一點二二五；新值四十用同一組訓練統計量得到二點四四九。</desc>
<rect width="720" height="307" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">標準化把中心移到 0，再換掉刻度</text><text x="27" y="62" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">訓練平均 20。每 1 個標準差約等於 8.165 個原始單位。</text><text x="26" y="110" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">原始值</text><text x="26" y="211" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">Z-score</text><line x1="112" y1="124" x2="685" y2="124" stroke="#50647b" stroke-width="2"/><line x1="112" y1="225" x2="685" y2="225" stroke="#50647b" stroke-width="2"/><line x1="158" y1="128" x2="158" y2="219" stroke="#d9e3ef" stroke-width="2" stroke-dasharray="4 5"/><circle cx="158" cy="124" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><circle cx="158" cy="225" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><text x="158" y="105" text-anchor="middle" fill="#155eaa" font-size="16" font-weight="500">10</text><text x="158" y="251" text-anchor="middle" fill="#155eaa" font-size="16" font-weight="500">-1.225</text><line x1="321" y1="128" x2="321" y2="219" stroke="#d9e3ef" stroke-width="2" stroke-dasharray="4 5"/><circle cx="321" cy="124" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><circle cx="321" cy="225" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><text x="321" y="105" text-anchor="middle" fill="#155eaa" font-size="16" font-weight="500">20</text><text x="321" y="251" text-anchor="middle" fill="#155eaa" font-size="16" font-weight="500">0</text><line x1="484" y1="128" x2="484" y2="219" stroke="#d9e3ef" stroke-width="2" stroke-dasharray="4 5"/><circle cx="484" cy="124" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><circle cx="484" cy="225" r="6" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><text x="484" y="105" text-anchor="middle" fill="#155eaa" font-size="16" font-weight="500">30</text><text x="484" y="251" text-anchor="middle" fill="#155eaa" font-size="16" font-weight="500">1.225</text><line x1="647" y1="128" x2="647" y2="219" stroke="#d9e3ef" stroke-width="2" stroke-dasharray="4 5"/><circle cx="647" cy="124" r="6" fill="#a64614" stroke="#ffffff" stroke-width="1.5"/><circle cx="647" cy="225" r="6" fill="#a64614" stroke="#ffffff" stroke-width="1.5"/><text x="647" y="105" text-anchor="middle" fill="#a64614" font-size="16" font-weight="500">40</text><text x="647" y="251" text-anchor="middle" fill="#a64614" font-size="16" font-weight="500">2.449</text><text x="26" y="283" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">藍色為訓練值。橘色 40 是新值，與訓練集共用座標。</text></g>
</svg>
