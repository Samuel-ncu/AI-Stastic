<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" width="720" height="335" role="img" aria-labelledby="title desc">
<title id="title">切分單位決定測到的是誰</title><desc id="desc">按影像切分時，學生 A 同時出現在訓練與留出資料。按拍攝者切分時，學生 A 與 B 都在訓練，學生 C 完全留出。</desc>
<rect width="720" height="335" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">切分單位決定測到的是誰</text><text x="26" y="106" text-anchor="start" fill="#172c45" font-size="17" font-weight="700">按影像分</text><text x="26" y="230" text-anchor="start" fill="#172c45" font-size="17" font-weight="700">按拍攝者分</text><text x="222" y="82" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">訓練</text><text x="481" y="82" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">留出評估</text><line x1="416" y1="89" x2="416" y2="314" stroke="#50647b" stroke-width="2" stroke-dasharray="5 4"/><rect x="200" y="115" width="188" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="213" y="140" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">學生 A、B</text><text x="213" y="164" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">A 的圖 1／B 的圖 1</text><rect x="469" y="115" width="204" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="482" y="140" text-anchor="start" fill="#a64614" font-size="16" font-weight="700">學生 A、C</text><text x="482" y="164" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">A 的圖 2／C 的圖 1</text><rect x="200" y="239" width="188" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="213" y="264" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">學生 A、B</text><text x="213" y="288" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">A、B 的所有影像</text><rect x="469" y="239" width="204" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="482" y="264" text-anchor="start" fill="#126c56" font-size="16" font-weight="700">學生 C</text><text x="482" y="288" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">C 的所有影像</text></g>
</svg>
