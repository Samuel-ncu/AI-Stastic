<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="720" height="334" role="img" aria-labelledby="title desc">
<title id="title">檢測陽性可以來自兩群產品</title><desc id="desc">缺陷一百件中九十件被判陽性，良品九千九百件中四百九十五件被判陽性。兩路合計五百八十五件。</desc>
<rect width="720" height="334" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">檢測陽性可以來自兩群產品</text><text x="27" y="62" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">假設缺陷率 1%、檢出率 90%、良品偽陽性率 5%。圖中只追蹤陽性。</text><rect x="25" y="154" width="166" height="68" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="38" y="179" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">10,000 件</text><text x="38" y="203" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">全部產品</text><rect x="245" y="94" width="180" height="68" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="258" y="119" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">100 件缺陷</text><text x="258" y="143" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">占全部 1%</text><rect x="245" y="207" width="180" height="68" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="258" y="232" text-anchor="start" fill="#a64614" font-size="16" font-weight="700">9,900 件良品</text><text x="258" y="256" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">占全部 99%</text><rect x="485" y="94" width="205" height="68" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="498" y="119" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">90 件真陽性</text><text x="498" y="143" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">100 × 90%</text><rect x="485" y="207" width="205" height="68" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="498" y="232" text-anchor="start" fill="#a64614" font-size="16" font-weight="700">495 件偽陽性</text><text x="498" y="256" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">9,900 × 5%</text><line x1="191" y1="176" x2="245" y2="128" stroke="#50647b" stroke-width="2"/><polyline points="241.963,136.472 245.000,128.000 236.230,130.022" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="191" y1="204" x2="245" y2="241" stroke="#50647b" stroke-width="2"/><polyline points="236.046,240.095 245.000,241.000 240.923,232.976" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="425" y1="128" x2="485" y2="128" stroke="#50647b" stroke-width="2"/><polyline points="477.102,132.315 485.000,128.000 477.102,123.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="425" y1="241" x2="485" y2="241" stroke="#50647b" stroke-width="2"/><polyline points="477.102,245.315 485.000,241.000 477.102,236.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="486" y="306" text-anchor="start" fill="#172c45" font-size="16" font-weight="700">陽性共 585 件，缺陷占 90／585</text></g>
</svg>
