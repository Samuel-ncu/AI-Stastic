<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="title desc">
<title id="title">相同平均，也可能有不同的單次體驗</title><desc id="desc">A 的兩筆延遲都是 10 ms；B 的兩筆是 6 與 14 ms。四個點有相同中心，但各裝置的分散不同。</desc>
<rect width="720" height="290" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">相同平均，也可能有不同的單次體驗</text><text x="27" y="62" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">自編例子。每個圓點代表一次操作，A 的兩點垂直錯開以便辨識。</text><line x1="118" y1="232" x2="118" y2="238" stroke="#50647b" stroke-width="1"/><text x="118" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">0</text><line x1="188.125" y1="232" x2="188.125" y2="238" stroke="#50647b" stroke-width="1"/><text x="188.125" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">2</text><line x1="258.25" y1="232" x2="258.25" y2="238" stroke="#50647b" stroke-width="1"/><text x="258.25" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">4</text><line x1="328.375" y1="232" x2="328.375" y2="238" stroke="#50647b" stroke-width="1"/><text x="328.375" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">6</text><line x1="398.5" y1="232" x2="398.5" y2="238" stroke="#50647b" stroke-width="1"/><text x="398.5" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">8</text><line x1="468.625" y1="232" x2="468.625" y2="238" stroke="#50647b" stroke-width="1"/><text x="468.625" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">10</text><line x1="538.75" y1="232" x2="538.75" y2="238" stroke="#50647b" stroke-width="1"/><text x="538.75" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">12</text><line x1="608.875" y1="232" x2="608.875" y2="238" stroke="#50647b" stroke-width="1"/><text x="608.875" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">14</text><line x1="679" y1="232" x2="679" y2="238" stroke="#50647b" stroke-width="1"/><text x="679" y="254" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">16</text><line x1="118" y1="78" x2="118" y2="232" stroke="#50647b" stroke-width="1"/><line x1="118" y1="232" x2="679" y2="232" stroke="#50647b" stroke-width="1"/><text x="398.5" y="276" text-anchor="middle" fill="#50647b" font-size="14" font-weight="500">辨識延遲（ms）</text><line x1="468.625" y1="90" x2="468.625" y2="219" stroke="#126c56" stroke-width="2" stroke-dasharray="5 4"/><text x="478.625" y="97" text-anchor="start" fill="#126c56" font-size="14" font-weight="500">共同平均 10 ms</text><text x="28" y="132" text-anchor="start" fill="#172c45" font-size="16" font-weight="700">裝置 A</text><text x="28" y="197" text-anchor="start" fill="#172c45" font-size="16" font-weight="700">裝置 B</text><line x1="118" y1="138" x2="679" y2="138" stroke="#d9e3ef" stroke-width="1"/><line x1="118" y1="203" x2="679" y2="203" stroke="#d9e3ef" stroke-width="1"/><circle cx="468.625" cy="128" r="9" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><circle cx="468.625" cy="145" r="9" fill="#155eaa" stroke="#ffffff" stroke-width="1.5"/><circle cx="328.375" cy="193" r="9" fill="#a64614" stroke="#ffffff" stroke-width="1.5"/><circle cx="608.875" cy="193" r="9" fill="#a64614" stroke="#ffffff" stroke-width="1.5"/></g>
</svg>
