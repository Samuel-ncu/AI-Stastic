<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354" width="720" height="354" role="img" aria-labelledby="title desc">
<title id="title">平方會讓大誤差的懲罰增加得更快</title><desc id="desc">誤差從二增加到四時，絕對損失從二提高到四，平方損失從四提高到十六。兩條曲線的單位不同。</desc>
