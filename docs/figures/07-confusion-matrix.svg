<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 321" width="720" height="321" role="img" aria-labelledby="title desc">
<title id="title">從混淆矩陣選對分母</title><desc id="desc">實際良品列為九百七十與二十。實際缺陷列為二與八。精確率用八除以二十八，召回率用八除以十。</desc>
<rect width="720" height="321" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">從混淆矩陣選對分母</text><text x="32" y="114" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">真實狀態</text><text x="181" y="87" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">預測良品</text><text x="415" y="87" text-anchor="start" fill="#50647b" font-size="16" font-weight="500">預測缺陷</text><text x="31" y="158" text-anchor="start" fill="#172c45" font-size="16" font-weight="700">實際良品</text><text x="31" y="248" text-anchor="start" fill="#172c45" font-size="16" font-weight="700">實際缺陷</text><rect x="184" y="101" width="216" height="77" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="199" y="134" text-anchor="start" fill="#155eaa" font-size="25" font-weight="700">970</text><text x="199" y="159" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">TN｜正確放行</text><rect x="416" y="101" width="216" height="77" rx="9" fill="#fff3e9" stroke="#d9e3ef"/><text x="431" y="134" text-anchor="start" fill="#a64614" font-size="25" font-weight="700">20</text><text x="431" y="159" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">FP｜誤報</text><rect x="184" y="192" width="216" height="77" rx="9" fill="#fff3e9" stroke="#d9e3ef"/><text x="199" y="225" text-anchor="start" fill="#a64614" font-size="25" font-weight="700">2</text><text x="199" y="250" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">FN｜漏判</text><rect x="416" y="192" width="216" height="77" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="431" y="225" text-anchor="start" fill="#155eaa" font-size="25" font-weight="700">8</text><text x="431" y="250" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">TP｜正確攔下</text><text x="183" y="301" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">看缺陷欄得到 Precision 分母 28；看缺陷列得到 Recall 分母 10。</text></g>
</svg>
