<text x="365" y="495" fill="#50647b" font-size="15" font-weight="500" text-anchor="middle">模型預測超時的機率 p</text>
<line x1="82" y1="526" x2="113" y2="526" stroke="#155eaa" stroke-width="3"/><text x="123" y="531" fill="#155eaa" font-size="15" font-weight="500" text-anchor="start">實際超時（y = 1）</text>
<line x1="357" y1="526" x2="389" y2="526" stroke="#a64614" stroke-width="3" stroke-dasharray="8 5"/><text x="399" y="531" fill="#a64614" font-size="15" font-weight="500" text-anchor="start">實際未超時（y = 0）</text>
</g>
