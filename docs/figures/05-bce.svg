<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 562" width="720" height="562" role="img" aria-labelledby="title desc">
<title id="title">二元交叉熵，從兩類機率讀出損失</title>
<desc id="desc">模型預測超時 80%、未超時 20%。若實際超時，BCE 是 0.223；實際未超時，BCE 是 1.609。下方兩條曲線對照不同超時機率下的單筆損失。</desc>
<rect width="720" height="562" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif">
<text x="26" y="37" fill="#172c45" font-size="23" font-weight="700" text-anchor="start">二元交叉熵，從兩類機率讀出損失</text>
<text x="27" y="63" fill="#50647b" font-size="14" font-weight="500" text-anchor="start">上圖先讀模型的預測分布，下圖再依實際標籤選損失曲線。</text>
<text x="27" y="102" fill="#172c45" font-size="16" font-weight="700" text-anchor="start">A　模型的預測分布（p = 0.8）</text>
<rect x="70" y="122" width="472" height="36" fill="#155eaa" rx="4"/><rect x="542" y="122" width="118" height="36" fill="#a64614" rx="4"/>
<text x="306" y="146" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">超時 80%</text><text x="601" y="146" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">未超時 20%</text>
<text x="70" y="185" fill="#50647b" font-size="14" font-weight="500" text-anchor="start">實際標籤決定要取上方哪一段機率，再對這個機率取負對數。</text>
<line x1="26" y1="203" x2="694" y2="203" stroke="#d9e3ef" stroke-width="1"/>
<text x="27" y="229" fill="#172c45" font-size="16" font-weight="700" text-anchor="start">B　實際標籤不同，讀不同的損失曲線</text>
<text x="70" y="250" fill="#50647b" font-size="14" font-weight="500" text-anchor="start">單筆 BCE</text><line x1="70" y1="448" x2="660" y2="448" stroke="#d9e3ef" stroke-width="1"/><text x="57" y="453" fill="#50647b" font-size="14" font-weight="500" text-anchor="end">0</text><line x1="70" y1="400.5" x2="660" y2="400.5" stroke="#d9e3ef" stroke-width="1"/><text x="57" y="405.5" fill="#50647b" font-size="14" font-weight="500" text-anchor="end">1</text><line x1="70" y1="353" x2="660" y2="353" stroke="#d9e3ef" stroke-width="1"/><text x="57" y="358" fill="#50647b" font-size="14" font-weight="500" text-anchor="end">2</text><line x1="70" y1="305.5" x2="660" y2="305.5" stroke="#d9e3ef" stroke-width="1"/><text x="57" y="310.5" fill="#50647b" font-size="14" font-weight="500" text-anchor="end">3</text><line x1="70" y1="258" x2="660" y2="258" stroke="#d9e3ef" stroke-width="1"/><text x="57" y="263" fill="#50647b" font-size="14" font-weight="500" text-anchor="end">4</text><line x1="70" y1="448" x2="70" y2="454" stroke="#50647b" stroke-width="1"/><text x="70" y="473" fill="#50647b" font-size="14" font-weight="500" text-anchor="middle">0</text><line x1="188" y1="448" x2="188" y2="454" stroke="#50647b" stroke-width="1"/><text x="188" y="473" fill="#50647b" font-size="14" font-weight="500" text-anchor="middle">0.2</text><line x1="306" y1="448" x2="306" y2="454" stroke="#50647b" stroke-width="1"/><text x="306" y="473" fill="#50647b" font-size="14" font-weight="500" text-anchor="middle">0.4</text><line x1="424" y1="448" x2="424" y2="454" stroke="#50647b" stroke-width="1"/><text x="424" y="473" fill="#50647b" font-size="14" font-weight="500" text-anchor="middle">0.6</text><line x1="542" y1="448" x2="542" y2="454" stroke="#50647b" stroke-width="1"/><text x="542" y="473" fill="#50647b" font-size="14" font-weight="500" text-anchor="middle">0.8</text><line x1="660" y1="448" x2="660" y2="454" stroke="#50647b" stroke-width="1"/><text x="660" y="473" fill="#50647b" font-size="14" font-weight="500" text-anchor="middle">1</text>
<line x1="70" y1="258" x2="70" y2="448" stroke="#50647b" stroke-width="1"/><line x1="70" y1="448" x2="660" y2="448" stroke="#50647b" stroke-width="1"/>
