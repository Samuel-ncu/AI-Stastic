<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-labelledby="title desc">
<title id="title">同一組注意力權重，接到兩種計算</title><desc id="desc">Q 與 K 生成權重。權重單獨算得注意力熵約零點五三比特，權重結合 V 則得到加權輸出約九點零五。</desc>
<rect width="720" height="312" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">同一組注意力權重，接到兩種計算</text><text x="27" y="62" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">使用本節的兩個位置，固定查詢位置 2。</text><rect x="28" y="111" width="174" height="69" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="41" y="136" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">位置 2 的 Q</text><text x="41" y="160" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">q₂ = 1</text><rect x="28" y="215" width="174" height="69" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="41" y="240" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">各位置的 K</text><text x="41" y="264" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">k₁ = 2，k₂ = 0</text><rect x="270" y="112" width="175" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="283" y="137" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">點積與 Softmax</text><text x="283" y="161" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">權重約 0.881、0.119</text><rect x="270" y="216" width="175" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="283" y="241" text-anchor="start" fill="#a64614" font-size="16" font-weight="700">各位置的 V</text><text x="283" y="265" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">v₁ = 10，v₂ = 2</text><rect x="513" y="112" width="175" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="526" y="137" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">注意力熵</text><text x="526" y="161" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">約 0.53 bit</text><rect x="513" y="216" width="175" height="67" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="526" y="241" text-anchor="start" fill="#a64614" font-size="16" font-weight="700">加權輸出</text><text x="526" y="265" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">約 9.05</text><line x1="202" y1="144" x2="270" y2="144" stroke="#50647b" stroke-width="2"/><polyline points="262.102,148.315 270.000,144.000 262.102,139.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="202" y1="241" x2="270" y2="165" stroke="#50647b" stroke-width="2"/><polyline points="267.949,173.763 270.000,165.000 261.518,168.009" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="445" y1="144" x2="513" y2="144" stroke="#50647b" stroke-width="2"/><polyline points="505.102,148.315 513.000,144.000 505.102,139.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="445" y1="161" x2="506" y2="240" stroke="#50647b" stroke-width="2"/><polyline points="497.758,236.386 506.000,240.000 504.588,231.111" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="445" y1="251" x2="513" y2="251" stroke="#50647b" stroke-width="2"/><polyline points="505.102,255.315 513.000,251.000 505.102,246.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</svg>
