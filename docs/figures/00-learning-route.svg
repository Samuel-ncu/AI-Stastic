<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 251" width="720" height="251" role="img" aria-labelledby="title desc">
<title id="title">從資料到模型，再用證據驗收</title><desc id="desc">定義資料後建立模型，驗證泛化後判讀決策成本與差距。以驗證資料更新設定，再進行最後測試。</desc>
<rect width="720" height="251" fill="#ffffff" rx="12" stroke="#d9e3ef"/>
<g font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif"><text x="26" y="37" text-anchor="start" fill="#172c45" font-size="23" font-weight="700">從資料到模型，再用證據驗收</text><text x="27" y="62" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">把模型設計與評估放回同一個問題。</text><rect x="19" y="103" width="153" height="76" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="32" y="128" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">定義問題</text><text x="32" y="152" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">單位、資料、標籤</text><rect x="195" y="103" width="153" height="76" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="208" y="128" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">建立模型</text><text x="208" y="152" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">輸入、預測、損失</text><rect x="371" y="103" width="153" height="76" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="384" y="128" text-anchor="start" fill="#155eaa" font-size="16" font-weight="700">驗證泛化</text><text x="384" y="152" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">切分、驗證分數</text><rect x="547" y="103" width="153" height="76" rx="9" fill="#f1f6fc" stroke="#d9e3ef"/><text x="560" y="128" text-anchor="start" fill="#126c56" font-size="16" font-weight="700">判讀與驗收</text><text x="560" y="152" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">成本、差距、限制</text><line x1="172" y1="139" x2="194" y2="139" stroke="#50647b" stroke-width="2"/><polyline points="186.102,143.315 194.000,139.000 186.102,134.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="348" y1="139" x2="370" y2="139" stroke="#50647b" stroke-width="2"/><polyline points="362.102,143.315 370.000,139.000 362.102,134.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="524" y1="139" x2="546" y2="139" stroke="#50647b" stroke-width="2"/><polyline points="538.102,143.315 546.000,139.000 538.102,134.685" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="447" y1="179" x2="447" y2="208" stroke="#50647b" stroke-width="2"/><line x1="271" y1="208" x2="623" y2="208" stroke="#50647b" stroke-width="2"/><line x1="271" y1="208" x2="271" y2="179" stroke="#50647b" stroke-width="2"/><polyline points="275.315,186.898 271.000,179.000 266.685,186.898" stroke="#50647b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="283" y="232" text-anchor="start" fill="#50647b" font-size="14" font-weight="500">以驗證資料更新設定，再做最後測試</text></g>
</svg>
